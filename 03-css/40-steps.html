<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>00-template</title>
    <link rel="stylesheet" href="../src/css/style.css">
    <style>
        :root{
            --size: 256px;
        }
        body {
            overflow: hidden;
        }
        section {
            div.bg {
                background: url(imgs/bg-steps.png)
                            no-repeat center / cover;
                corner-shape: squircle;
                height: 480px;
                border-radius: 12px;
                outline: 4px solid #fff;
                position: relative;

                div.info {
                    background-color: #0009;
                    border-radius: 12px;
                    corner-shape: squircle;
                    color: #fff;
                    font-size: 1.6rem;
                    text-align: center;
                    position: absolute;
                    top: 0.8rem;
                    left: 0.8rem;
                    padding: 0.4rem;
                    width: 340px;
                }


                div#trainer {
                    background: url(imgs/steps-all.png)
                                no-repeat;
                    height: var(--size);
                    width: var(--size);
                    transform: scale(.8);
                    position: absolute;
                    bottom: 0;
                    left: 4rem;

                    animation: 0.6s animTrainer steps(4) infinite;

                    &.front { background-position-y: calc(var(--size) * 0); }
                    &.left { background-position-y: calc(var(--size) * -1); }
                    &.right { background-position-y: calc(var(--size) * -2); }
                    &.back { background-position-y: calc(var(--size) * -3); }
                }
            }
        }
        @keyframes animTrainer {
            100% {background-position-x: -1034px ;}
        }


    </style>
    </head>
<body class="css">
    <nav class="back">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
        <h1>01-document-style</h1>
        <img src="../src/imgs/logo-css.png" alt="css">
        <h3>Description</h3>
        </header>
        <section>
          <h2 class="subtitle">Example:</h2>
          <div class="bg">
            <div class="info">
                Please press the arrow keys: <br>
                &larr; &uarr; &rarr; &darr;
            </div>
          <div id="trainer" class="front"></div>
          </div>
        </section>
        </menu>
        <script> 
            const trainer = document.getElementById('trainer');
            document.addEventListener('keydown', function(e) { 
                //console.log(e.keyCode);
                switch (e.keyCode) {
                    case 37: // left
                        trainer.className = '';
                        trainer.classList.add('left');
                        break;
                    case 38: // up
                        trainer.className = '';
                        trainer.classList.add('back');
                        break;
                    case 39: // right
                        trainer.className = '';
                        trainer.classList.add('right');
                        break;
                    case 40: // down
                        trainer.className = '';
                        trainer.classList.add('front');
                        break;
                }
            })
        </script>
    </main>
</body>
</html>
